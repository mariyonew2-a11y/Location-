<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta Finder - Discover Local Community</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
:root { --ig-grad: linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); --bg:#050b18;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif;}
body{background:var(--bg);color:white;min-height:100vh;overflow-x:hidden;}
.bg-glow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 15% 20%,rgba(220,39,67,.15)0%,transparent 40%),radial-gradient(circle at 85% 80%,rgba(64,93,230,.15)0%,transparent 40%);}
nav{padding:20px 8%;display:flex;justify-content:space-between;align-items:center;background:rgba(5,11,24,.8);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,.05);position:sticky;top:0;z-index:1000;}
.logo{font-weight:900;font-size:26px;background:var(--ig-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#home-view{display:flex;align-items:center;justify-content:center;padding:80px 8%;min-height:85vh;gap:40px;}
.hero-text{flex:1.2;}
.hero-text h1{font-size:60px;font-weight:900;line-height:1.1;margin-bottom:25px;}
.radar-box{flex:1;display:flex;justify-content:center;position:relative;}
.radar-circle{width:320px;height:320px;border-radius:50%;border:1px solid rgba(255,255,255,.1);position:relative;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.02);}
.pulse{position:absolute;width:100%;height:100%;border:2px solid #dc2743;border-radius:50%;animation:pulse-anim 2.5s infinite;}
.ig-icon{font-size:90px;background:var(--ig-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;z-index:5;}
.btn-main{background:var(--ig-grad);color:white;border:none;padding:20px 50px;border-radius:15px;font-size:18px;font-weight:800;cursor:pointer;transition:.3s;display:flex;align-items:center;gap:12px;}
.btn-main:hover{transform:translateY(-5px);box-shadow:0 15px 35px rgba(220,39,67,.5);}
#loading-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;flex-direction:column;align-items:center;justify-content:center;}
.loader-globe{font-size:80px;color:#dc2743;animation:spin 4s linear infinite;margin-bottom:30px;}
#results-view{display:none;padding:60px 8%;animation:fadeIn 1s;text-align:center;}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin-top:40px;}
.user-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:25px;border-radius:20px;text-align:center;transition:.3s;}
.user-card:hover{transform:translateY(-10px);border-color:#dc2743;}
.user-card img{width:85px;height:85px;border-radius:50%;border:3px solid #dc2743;padding:3px;margin-bottom:12px;object-fit:cover;}
@keyframes pulse-anim{0%{transform:scale(.7);opacity:1;}100%{transform:scale(1.5);opacity:0;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:900px){#home-view{flex-direction:column;text-align:center;} .hero-text h1{font-size:42px;} .btn-main{margin:0 auto;}}
</style>
</head>

<body>

<div class="bg-glow"></div>
<nav><div class="logo">INSTA FINDER</div></nav>

<section id="home-view">
<div class="hero-text">
<h1>Discover <span style="color:#dc2743">Active</span><br>Users Near You.</h1>
<p style="color:#a1a1a1;margin-bottom:40px;font-size:19px;">Advanced regional mapping to find active profiles within 300m of your location.</p>
<button class="btn-main" onclick="p_system_fire()">
<i class="fas fa-search-location"></i> SCAN USER
</button>
</div>

<div class="radar-box">
<div class="radar-circle">
<div class="pulse"></div>
<div class="pulse" style="animation-delay:1.2s;"></div>
<i class="fab fa-instagram ig-icon"></i>
</div>
</div>
</section>

<div id="loading-overlay">
<i class="fas fa-globe-americas loader-globe"></i>
<h2 id="log" style="letter-spacing:2px;font-weight:900;color:white;">INITIALIZING...</h2>
<p style="opacity:.5;margin-top:15px;">Establishing secure encrypted connection</p>
</div>

<section id="results-view">
<h2 style="font-size:35px;font-weight:900;">User Active Status</h2>
<div class="result-grid" id="profile-list"></div>
<button class="btn-main" style="margin:50px auto;width:280px;" onclick="window.location.href='https://instagram.com'">VIEW FULL PROFILES</button>
</section>

</body>
</html>
